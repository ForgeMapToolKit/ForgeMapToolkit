<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins',sans-serif">
  <rect width="680" height="220" fill="#0e0e10"/>

  <!-- Title -->
  <text x="24" y="26" fill="#C86FFF" font-size="8.5" font-weight="700" letter-spacing="0.12em">4 WAVE LAYERS — COMBINED</text>

  <!-- Layer boxes -->
  <!-- Layer 0: very large -->
  <rect x="24" y="40" width="148" height="60" fill="rgba(200,111,255,0.05)" stroke="rgba(200,111,255,0.25)" stroke-width="1"/>
  <rect x="24" y="40" width="3" height="60" fill="#C86FFF" opacity="0.7"/>
  <text x="36" y="57" fill="#C86FFF" font-size="8" font-weight="700" letter-spacing="0.08em">LAYER 0</text>
  <text x="36" y="71" fill="#777" font-size="7.5">NormalRepeat: 0.05</text>
  <text x="36" y="83" fill="#777" font-size="7.5">waves1_400m.dds</text>
  <text x="36" y="95" fill="#444" font-size="7">→ broad ocean swells</text>

  <!-- Layer 1 -->
  <rect x="184" y="40" width="148" height="60" fill="rgba(200,111,255,0.04)" stroke="rgba(200,111,255,0.18)" stroke-width="1"/>
  <rect x="184" y="40" width="3" height="60" fill="rgba(200,111,255,0.5)"/>
  <text x="196" y="57" fill="rgba(200,111,255,0.8)" font-size="8" font-weight="700" letter-spacing="0.08em">LAYER 1</text>
  <text x="196" y="71" fill="#777" font-size="7.5">NormalRepeat: 0.20</text>
  <text x="196" y="83" fill="#777" font-size="7.5">waves1_120m.dds</text>
  <text x="196" y="95" fill="#444" font-size="7">→ mid-scale chop</text>

  <!-- Layer 2 -->
  <rect x="344" y="40" width="148" height="60" fill="rgba(200,111,255,0.03)" stroke="rgba(200,111,255,0.13)" stroke-width="1"/>
  <rect x="344" y="40" width="3" height="60" fill="rgba(200,111,255,0.35)"/>
  <text x="356" y="57" fill="rgba(200,111,255,0.6)" font-size="8" font-weight="700" letter-spacing="0.08em">LAYER 2</text>
  <text x="356" y="71" fill="#777" font-size="7.5">NormalRepeat: 0.45</text>
  <text x="356" y="83" fill="#777" font-size="7.5">waves1_40m.dds</text>
  <text x="356" y="95" fill="#444" font-size="7">→ fine surface ripples</text>

  <!-- Layer 3 -->
  <rect x="504" y="40" width="152" height="60" fill="rgba(200,111,255,0.02)" stroke="rgba(200,111,255,0.1)" stroke-width="1"/>
  <rect x="504" y="40" width="3" height="60" fill="rgba(200,111,255,0.2)"/>
  <text x="516" y="57" fill="rgba(200,111,255,0.45)" font-size="8" font-weight="700" letter-spacing="0.08em">LAYER 3</text>
  <text x="516" y="71" fill="#777" font-size="7.5">NormalRepeat: 0.80</text>
  <text x="516" y="83" fill="#777" font-size="7.5">waves1_40m.dds</text>
  <text x="516" y="95" fill="#444" font-size="7">→ micro detail</text>

  <!-- Arrows down -->
  <line x1="98"  y1="103" x2="98"  y2="126" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="258" y1="103" x2="258" y2="126" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="418" y1="103" x2="418" y2="126" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="580" y1="103" x2="580" y2="126" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="98"  y="119" text-anchor="middle" fill="#333" font-size="9">↓</text>
  <text x="258" y="119" text-anchor="middle" fill="#333" font-size="9">↓</text>
  <text x="418" y="119" text-anchor="middle" fill="#333" font-size="9">↓</text>
  <text x="580" y="119" text-anchor="middle" fill="#333" font-size="9">↓</text>

  <!-- Combined result bar -->
  <rect x="24" y="130" width="632" height="46" fill="rgba(100,160,255,0.07)" stroke="rgba(100,200,255,0.2)" stroke-width="1"/>
  <rect x="24" y="130" width="3" height="46" fill="rgba(100,200,255,0.6)"/>
  <text x="36" y="149" fill="rgba(150,220,255,0.8)" font-size="8.5" font-weight="700" letter-spacing="0.1em">COMBINED NORMAL MAP</text>
  <text x="36" y="165" fill="#555" font-size="8" letter-spacing="0.04em">All 4 layers added per-pixel → complex wave surface → lighting, reflections, wave crests emerge</text>

  <!-- Wave crest label -->
  <text x="24" y="198" fill="#ff8c00" font-size="8" letter-spacing="0.07em">⚑  Wave crests appear automatically where layers constructively interfere — no separate parameter</text>
</svg>

<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins',sans-serif">
  <!-- Background -->
  <rect width="680" height="260" fill="#0e0e10"/>

  <!-- Terrain shape -->
  <polygon points="0,260 0,180 60,175 120,165 180,140 240,95 300,75 340,70 340,260" fill="#1a1a1c"/>
  <polygon points="680,260 680,180 620,175 560,165 500,140 440,95 400,80 340,70 340,260" fill="#1a1a1c"/>

  <!-- Abyss zone -->
  <rect x="0" y="170" width="680" height="90" fill="rgba(10,20,40,0.55)"/>
  <!-- Deep zone -->
  <rect x="0" y="130" width="680" height="40" fill="rgba(12,28,60,0.5)"/>
  <!-- Surface zone -->
  <rect x="0" y="100" width="680" height="30" fill="rgba(14,36,80,0.45)"/>

  <!-- Water surface line -->
  <line x1="0" y1="100" x2="680" y2="100" stroke="#C86FFF" stroke-width="1.5" stroke-dasharray="none"/>

  <!-- ElevationDeep line -->
  <line x1="0" y1="130" x2="680" y2="130" stroke="rgba(200,111,255,0.35)" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ElevationAbyss line -->
  <line x1="0" y1="170" x2="680" y2="170" stroke="rgba(200,111,255,0.2)" stroke-width="1" stroke-dasharray="3,5"/>

  <!-- Labels right side -->
  <text x="648" y="96" text-anchor="end" fill="#C86FFF" font-size="9" font-weight="700" letter-spacing="0.1em">ELEVATION</text>
  <text x="648" y="108" text-anchor="end" fill="rgba(200,111,255,0.5)" font-size="8" letter-spacing="0.06em">water surface</text>

  <text x="648" y="126" text-anchor="end" fill="rgba(200,111,255,0.6)" font-size="9" font-weight="700" letter-spacing="0.1em">ELEVATION DEEP</text>
  <text x="648" y="138" text-anchor="end" fill="rgba(200,111,255,0.35)" font-size="8" letter-spacing="0.06em">deep zone begins</text>

  <text x="648" y="166" text-anchor="end" fill="rgba(200,111,255,0.4)" font-size="9" font-weight="700" letter-spacing="0.1em">ELEVATION ABYSS</text>
  <text x="648" y="178" text-anchor="end" fill="rgba(200,111,255,0.25)" font-size="8" letter-spacing="0.06em">darkest zone</text>

  <!-- Zone fill labels left -->
  <text x="18" y="118" fill="rgba(180,220,255,0.6)" font-size="8" letter-spacing="0.08em">SHALLOW</text>
  <text x="18" y="153" fill="rgba(120,160,220,0.5)" font-size="8" letter-spacing="0.08em">DEEP</text>
  <text x="18" y="198" fill="rgba(60,100,160,0.45)" font-size="8" letter-spacing="0.08em">ABYSS</text>

  <!-- Terrain label -->
  <text x="180" y="230" fill="#383838" font-size="8" letter-spacing="0.08em">TERRAIN</text>
</svg>

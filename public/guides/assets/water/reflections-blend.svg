<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins',sans-serif">
  <rect width="680" height="240" fill="#0e0e10"/>

  <!-- Title -->
  <text x="24" y="26" fill="#C86FFF" font-size="8.5" font-weight="700" letter-spacing="0.12em">REFLECTION BLEND PIPELINE</text>

  <!-- Sky cubemap box -->
  <rect x="24" y="44" width="170" height="54" fill="rgba(200,111,255,0.05)" stroke="rgba(200,111,255,0.25)" stroke-width="1"/>
  <rect x="24" y="44" width="3" height="54" fill="#C86FFF" opacity="0.7"/>
  <text x="36" y="62" fill="#C86FFF" font-size="8" font-weight="700" letter-spacing="0.08em">SKY CUBEMAP</text>
  <text x="36" y="75" fill="#777" font-size="7.5">texCUBE(SkySampler, R)</text>
  <text x="36" y="88" fill="#444" font-size="7">TexPathCubemap · SkyReflection</text>

  <!-- Unit reflection box -->
  <rect x="24" y="114" width="170" height="54" fill="rgba(255,140,0,0.04)" stroke="rgba(255,140,0,0.2)" stroke-width="1"/>
  <rect x="24" y="114" width="3" height="54" fill="#ff8c00" opacity="0.6"/>
  <text x="36" y="132" fill="#ff8c00" font-size="8" font-weight="700" letter-spacing="0.08em">UNIT REFLECTIONS</text>
  <text x="36" y="145" fill="#777" font-size="7.5">tex2D(ReflectionSampler, pos)</text>
  <text x="36" y="158" fill="#444" font-size="7">Approximated from refraction buffer</text>

  <!-- Arrows to blend -->
  <line x1="194" y1="71"  x2="280" y2="100" stroke="rgba(200,111,255,0.3)" stroke-width="1"/>
  <line x1="194" y1="141" x2="280" y2="112" stroke="rgba(255,140,0,0.3)" stroke-width="1"/>
  <polygon points="278,96 284,103 272,106" fill="rgba(200,111,255,0.3)"/>
  <polygon points="278,116 284,109 272,106" fill="rgba(255,140,0,0.3)"/>

  <!-- Blend node -->
  <rect x="280" y="88" width="120" height="38" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="340" y="103" text-anchor="middle" fill="#888" font-size="8" font-weight="700" letter-spacing="0.06em">BLEND</text>
  <text x="340" y="117" text-anchor="middle" fill="#444" font-size="7">lerp(sky, units, units.alpha)</text>

  <!-- Fresnel box -->
  <rect x="280" y="148" width="120" height="38" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="340" y="163" text-anchor="middle" fill="#555" font-size="8" font-weight="700" letter-spacing="0.06em">FRESNEL</text>
  <text x="340" y="177" text-anchor="middle" fill="#333" font-size="7">angle → reflectivity</text>

  <!-- Arrow blend to final -->
  <line x1="400" y1="107" x2="460" y2="107" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="340" y1="148" x2="340" y2="130" stroke="rgba(255,255,255,0.07)" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="457,103 464,107 457,111" fill="rgba(255,255,255,0.1)"/>

  <!-- Final lerp -->
  <rect x="460" y="78" width="196" height="58" fill="rgba(200,111,255,0.04)" stroke="rgba(200,111,255,0.2)" stroke-width="1"/>
  <rect x="460" y="78" width="3" height="58" fill="#C86FFF" opacity="0.5"/>
  <text x="472" y="97" fill="rgba(200,111,255,0.8)" font-size="8" font-weight="700" letter-spacing="0.08em">FINAL LERP</text>
  <text x="472" y="110" fill="#777" font-size="7.5">lerp(refraction, reflections,</text>
  <text x="472" y="122" fill="#777" font-size="7.5">  fresnel × SkyReflection)</text>

  <!-- Note: legacy warning -->
  <rect x="24" y="185" width="632" height="30" fill="rgba(255,140,0,0.03)" stroke="rgba(255,140,0,0.12)" stroke-width="1"/>
  <text x="36" y="196" fill="#ff8c00" font-size="7.5" font-weight="700" letter-spacing="0.08em">⚠  LEGACY</text>
  <text x="36" y="208" fill="#555" font-size="7.5">FresnelBias and FresnelPower are parsed from the map file but never used in any shader function. Changing them has no effect.</text>
</svg>

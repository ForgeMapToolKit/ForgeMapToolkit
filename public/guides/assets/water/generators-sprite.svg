<svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins',sans-serif">
  <rect width="680" height="200" fill="#0e0e10"/>

  <text x="24" y="26" fill="#C86FFF" font-size="8.5" font-weight="700" letter-spacing="0.12em">WAVE GENERATOR — SPRITE STRIP ANIMATION</text>

  <!-- Sprite strip texture -->
  <text x="24" y="50" fill="#383838" font-size="7.5" letter-spacing="0.08em">TextureName (sprite strip)</text>
  <rect x="24" y="56" width="488" height="44" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Frame cells -->
  <rect x="24"  y="56" width="56" height="44" fill="rgba(200,111,255,0.1)"  stroke="rgba(200,111,255,0.3)" stroke-width="1"/>
  <rect x="80"  y="56" width="56" height="44" fill="rgba(200,111,255,0.07)" stroke="rgba(200,111,255,0.18)" stroke-width="0.5"/>
  <rect x="136" y="56" width="56" height="44" fill="rgba(200,111,255,0.05)" stroke="rgba(200,111,255,0.13)" stroke-width="0.5"/>
  <rect x="192" y="56" width="56" height="44" fill="rgba(200,111,255,0.04)" stroke="rgba(200,111,255,0.1)"  stroke-width="0.5"/>
  <rect x="248" y="56" width="56" height="44" fill="rgba(200,111,255,0.03)" stroke="rgba(200,111,255,0.07)" stroke-width="0.5"/>
  <rect x="304" y="56" width="56" height="44" fill="rgba(200,111,255,0.02)" stroke="rgba(200,111,255,0.06)" stroke-width="0.5"/>
  <rect x="360" y="56" width="56" height="44" fill="rgba(200,111,255,0.02)" stroke="rgba(200,111,255,0.05)" stroke-width="0.5"/>
  <rect x="416" y="56" width="56" height="44" fill="rgba(200,111,255,0.01)" stroke="rgba(200,111,255,0.05)" stroke-width="0.5"/>

  <!-- Wave shapes in frames (getting smaller/fading) -->
  <ellipse cx="52"  cy="78" rx="18" ry="8"  fill="rgba(200,111,255,0.5)"/>
  <ellipse cx="108" cy="78" rx="16" ry="7"  fill="rgba(200,111,255,0.4)"/>
  <ellipse cx="164" cy="78" rx="14" ry="6"  fill="rgba(200,111,255,0.3)"/>
  <ellipse cx="220" cy="78" rx="12" ry="5"  fill="rgba(200,111,255,0.22)"/>
  <ellipse cx="276" cy="78" rx="10" ry="4"  fill="rgba(200,111,255,0.15)"/>
  <ellipse cx="332" cy="78" rx="8"  cy="78" ry="3" fill="rgba(200,111,255,0.1)"/>
  <ellipse cx="388" cy="78" rx="6"  ry="2.5" fill="rgba(200,111,255,0.06)"/>
  <ellipse cx="444" cy="78" rx="4"  ry="2"  fill="rgba(200,111,255,0.03)"/>

  <!-- Frame labels -->
  <text x="52"  y="108" text-anchor="middle" fill="#555" font-size="7">F0</text>
  <text x="108" y="108" text-anchor="middle" fill="#444" font-size="7">F1</text>
  <text x="164" y="108" text-anchor="middle" fill="#444" font-size="7">F2</text>
  <text x="220" y="108" text-anchor="middle" fill="#383838" font-size="7">F3</text>
  <text x="276" y="108" text-anchor="middle" fill="#333" font-size="7">F4</text>
  <text x="332" y="108" text-anchor="middle" fill="#2e2e2e" font-size="7">F5</text>
  <text x="388" y="108" text-anchor="middle" fill="#2a2a2a" font-size="7">F6</text>
  <text x="444" y="108" text-anchor="middle" fill="#282828" font-size="7">F7</text>

  <!-- FrameCount label -->
  <line x1="24"  y1="116" x2="512" y2="116" stroke="rgba(200,111,255,0.2)" stroke-width="1"/>
  <line x1="24"  y1="112" x2="24"  y2="120" stroke="rgba(200,111,255,0.2)" stroke-width="1"/>
  <line x1="512" y1="112" x2="512" y2="120" stroke="rgba(200,111,255,0.2)" stroke-width="1"/>
  <text x="268" y="129" text-anchor="middle" fill="rgba(200,111,255,0.6)" font-size="7.5" letter-spacing="0.06em">FrameCount = 8</text>

  <!-- RampName texture -->
  <text x="524" y="50" fill="#383838" font-size="7.5" letter-spacing="0.08em">RampName (lifetime fade)</text>
  <rect x="524" y="56" width="132" height="44" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <defs>
    <linearGradient id="rampGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(200,111,255,0.0)"/>
      <stop offset="30%"  stop-color="rgba(200,111,255,0.45)"/>
      <stop offset="70%"  stop-color="rgba(200,111,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(200,111,255,0.0)"/>
    </linearGradient>
  </defs>
  <rect x="524" y="56" width="132" height="44" fill="url(#rampGrad)"/>
  <text x="590" y="82" text-anchor="middle" fill="#777" font-size="7.5">opacity</text>
  <text x="590" y="93" text-anchor="middle" fill="#555" font-size="7">over lifetime</text>

  <!-- Randomization table -->
  <text x="24" y="152" fill="#383838" font-size="7.5" letter-spacing="0.09em">RANDOMIZATION PER SPRITE</text>
  <line x1="24" y1="157" x2="656" y2="157" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <rect x="24"  y="163" width="3" height="28" fill="#ff8c00" opacity="0.6"/>
  <text x="36"  y="175" fill="#ccc" font-size="8" font-weight="600">Lifetime</text>
  <text x="36"  y="186" fill="#555" font-size="7">random(LifetimeFirst, LifetimeSecond) seconds per sprite</text>

  <rect x="234" y="163" width="3" height="28" fill="#C86FFF" opacity="0.5"/>
  <text x="246" y="175" fill="#ccc" font-size="8" font-weight="600">Period</text>
  <text x="246" y="186" fill="#555" font-size="7">random(PeriodFirst, PeriodSecond) seconds between spawns</text>

  <rect x="444" y="163" width="3" height="28" fill="rgba(100,200,255,0.5)"/>
  <text x="456" y="175" fill="#ccc" font-size="8" font-weight="600">Scale</text>
  <text x="456" y="186" fill="#555" font-size="7">random(ScaleFirst, ScaleSecond) size per sprite</text>
</svg>

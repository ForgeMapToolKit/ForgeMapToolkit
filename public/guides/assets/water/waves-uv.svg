<svg viewBox="0 0 680 210" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins',sans-serif">
  <rect width="680" height="210" fill="#0e0e10"/>

  <text x="24" y="26" fill="#C86FFF" font-size="8.5" font-weight="700" letter-spacing="0.12em">UV SCROLLING — WaterVS VERTEX SHADER</text>

  <!-- Formula -->
  <rect x="24" y="38" width="632" height="24" fill="rgba(200,111,255,0.04)" stroke="rgba(200,111,255,0.15)" stroke-width="1"/>
  <text x="340" y="54" text-anchor="middle" fill="#ccc" font-size="9.5" letter-spacing="0.04em">TexCoord[i]  =  WorldPos.xz × NormalRepeat[i]  +  Time × NormalMovement[i].xy</text>

  <!-- Four layer rows -->
  <!-- Header -->
  <text x="36"  y="84" fill="#383838" font-size="7.5" letter-spacing="0.09em">LAYER</text>
  <text x="130" y="84" fill="#383838" font-size="7.5" letter-spacing="0.09em">NormalRepeat</text>
  <text x="260" y="84" fill="#383838" font-size="7.5" letter-spacing="0.09em">SCALE EFFECT</text>
  <text x="390" y="84" fill="#383838" font-size="7.5" letter-spacing="0.09em">NormalMovement (X, Z)</text>
  <text x="560" y="84" fill="#383838" font-size="7.5" letter-spacing="0.09em">DRIFT DIRECTION</text>
  <line x1="24" y1="88" x2="656" y2="88" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Layer 0 -->
  <rect x="24" y="92" width="3" height="20" fill="#C86FFF" opacity="0.8"/>
  <text x="36"  y="106" fill="#C86FFF" font-size="8" font-weight="700">0</text>
  <text x="130" y="106" fill="#888" font-size="8">0.05</text>
  <text x="260" y="106" fill="#666" font-size="7.5">very large → broad swells</text>
  <text x="390" y="106" fill="#888" font-size="8">(0.004, 0.003)</text>
  <text x="560" y="106" fill="#555" font-size="7.5">slow, diagonal</text>

  <!-- Layer 1 -->
  <rect x="24" y="114" width="3" height="20" fill="rgba(200,111,255,0.55)"/>
  <text x="36"  y="128" fill="rgba(200,111,255,0.8)" font-size="8" font-weight="700">1</text>
  <text x="130" y="128" fill="#888" font-size="8">0.20</text>
  <text x="260" y="128" fill="#666" font-size="7.5">medium → ocean chop</text>
  <text x="390" y="128" fill="#888" font-size="8">(-0.008, 0.005)</text>
  <text x="560" y="128" fill="#555" font-size="7.5">cross-current, reversed X</text>

  <!-- Layer 2 -->
  <rect x="24" y="136" width="3" height="20" fill="rgba(200,111,255,0.35)"/>
  <text x="36"  y="150" fill="rgba(200,111,255,0.6)" font-size="8" font-weight="700">2</text>
  <text x="130" y="150" fill="#888" font-size="8">0.45</text>
  <text x="260" y="150" fill="#666" font-size="7.5">fine → surface ripples</text>
  <text x="390" y="150" fill="#888" font-size="8">(0.012, -0.006)</text>
  <text x="560" y="150" fill="#555" font-size="7.5">faster, different angle</text>

  <!-- Layer 3 -->
  <rect x="24" y="158" width="3" height="20" fill="rgba(200,111,255,0.2)"/>
  <text x="36"  y="172" fill="rgba(200,111,255,0.4)" font-size="8" font-weight="700">3</text>
  <text x="130" y="172" fill="#888" font-size="8">0.80</text>
  <text x="260" y="172" fill="#666" font-size="7.5">micro → tiny detail</text>
  <text x="390" y="172" fill="#888" font-size="8">(-0.005, -0.009)</text>
  <text x="560" y="172" fill="#555" font-size="7.5">opposing direction</text>

  <!-- Warning bar -->
  <rect x="24" y="186" width="632" height="20" fill="rgba(255,140,0,0.03)" stroke="rgba(255,140,0,0.12)" stroke-width="1"/>
  <text x="36" y="200" fill="#ff8c00" font-size="7.5" font-weight="700" letter-spacing="0.06em">⚠  CONVEYOR BELT WARNING</text>
  <text x="160" y="200" fill="#555" font-size="7.5">If all four layers share the same NormalMovement direction and speed, the result looks artificial. Use varied angles and magnitudes per layer.</text>
</svg>

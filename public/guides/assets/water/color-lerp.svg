<svg viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins',sans-serif">
  <rect width="680" height="230" fill="#0e0e10"/>

  <!-- Title -->
  <text x="24" y="26" fill="#C86FFF" font-size="8.5" font-weight="700" letter-spacing="0.12em">COLORLERP — DEPTH TO SURFACE COLOR BLEND</text>

  <!-- Gradient bar (shallow → deep) -->
  <defs>
    <linearGradient id="depthGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(180,220,255,0.15)"/>
      <stop offset="25%"  stop-color="rgba(80,140,220,0.25)"/>
      <stop offset="60%"  stop-color="rgba(30,80,180,0.45)"/>
      <stop offset="100%" stop-color="rgba(10,30,100,0.7)"/>
    </linearGradient>
  </defs>
  <rect x="24" y="44" width="632" height="46" fill="url(#depthGrad)" rx="0"/>
  <rect x="24" y="44" width="632" height="46" fill="none" stroke="rgba(200,111,255,0.12)" stroke-width="1"/>

  <!-- Shoreline label -->
  <text x="30"  y="40" fill="#555" font-size="7.5" letter-spacing="0.07em">SHORE</text>
  <text x="644" y="40" fill="#555" font-size="7.5" letter-spacing="0.07em" text-anchor="end">DEEP</text>

  <!-- Terrain visible zone (left) -->
  <rect x="24" y="44" width="160" height="46" fill="rgba(255,255,255,0.04)"/>
  <text x="104" y="72" text-anchor="middle" fill="#777" font-size="8" letter-spacing="0.06em">terrain visible</text>

  <!-- ColorLerp X marker -->
  <line x1="184" y1="36" x2="184" y2="100" stroke="rgba(200,111,255,0.5)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="184" y="32" text-anchor="middle" fill="#C86FFF" font-size="8" font-weight="700">ColorLerp.X</text>
  <text x="184" y="108" text-anchor="middle" fill="rgba(200,111,255,0.5)" font-size="7">blend starts</text>

  <!-- Gradient zone -->
  <rect x="184" y="44" width="256" height="46" fill="rgba(200,111,255,0.04)"/>
  <text x="312" y="72" text-anchor="middle" fill="#888" font-size="8" letter-spacing="0.06em">gradual blend</text>

  <!-- ColorLerp Y marker -->
  <line x1="440" y1="36" x2="440" y2="100" stroke="rgba(200,111,255,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="440" y="32" text-anchor="middle" fill="rgba(200,111,255,0.7)" font-size="8" font-weight="700">ColorLerp.Y</text>
  <text x="440" y="108" text-anchor="middle" fill="rgba(200,111,255,0.35)" font-size="7">blend complete</text>

  <!-- Full color zone (right) -->
  <rect x="440" y="44" width="216" height="46" fill="rgba(200,111,255,0.06)"/>
  <text x="548" y="72" text-anchor="middle" fill="#999" font-size="8" letter-spacing="0.06em">full SurfaceColor</text>

  <!-- Example values -->
  <text x="24" y="132" fill="#383838" font-size="7.5" letter-spacing="0.09em">EXAMPLES</text>
  <line x1="24" y1="137" x2="656" y2="137" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Example row 1 -->
  <rect x="24"  y="145" width="3" height="50" fill="rgba(100,180,255,0.5)"/>
  <text x="36"  y="162" fill="#ccc" font-size="8.5" font-weight="600">Tropical ocean</text>
  <text x="36"  y="176" fill="#666" font-size="7.5">ColorLerp: 0.02 → 0.5   wide range, gradual shore-to-deep</text>
  <text x="36"  y="188" fill="#444" font-size="7">SurfaceColor: (0.05, 0.12, 0.28)   deep blue tint</text>

  <!-- Example row 2 -->
  <rect x="340" y="145" width="3" height="50" fill="rgba(80,140,60,0.5)"/>
  <text x="352" y="162" fill="#ccc" font-size="8.5" font-weight="600">Murky swamp</text>
  <text x="352" y="176" fill="#666" font-size="7.5">ColorLerp: 0.01 → 0.08   snaps in fast, always colored</text>
  <text x="352" y="188" fill="#444" font-size="7">SurfaceColor: (0.04, 0.18, 0.06)   green-brown tint</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ForgeMapToolkit</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

    /*
     * Splash — clean, minimal, lots of negative space. Pure CSS/DOM: no
     * canvas, no WebGL, no requestAnimationFrame. It renders at the heaviest
     * moment (app startup), so it must cost almost nothing — only opacity /
     * transform animations on the compositor thread, and one static blur.
     */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden; user-select: none;
      -webkit-app-region: drag;
      background: radial-gradient(125% 100% at 50% 42%, #0c0d11 0%, #070708 58%, #050506 100%);
      font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    }

    /* Faint dot grid — a whisper of the home screen's surface, vignetted away
       so the centre stays clean negative space. */
    .grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 26px 26px;
      -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 32%, #000 100%);
              mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 32%, #000 100%);
    }

    /* ── Light source (A): a deep, wide, cool horizon glow seated low behind
       the wordmark, breathing slowly. Static blur (cheap); only opacity
       animates. Swap this block for variant B/C to change the lighting. ── */
    .glow {
      position: fixed; left: 50%; top: 57%; z-index: 2;
      width: 62vw; height: 34vh; max-width: 900px;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse 60% 100% at 50% 50%,
        rgba(192, 214, 255, 0.16) 0%,
        rgba(150, 180, 232, 0.05) 46%,
        transparent 72%);
      filter: blur(30px);
      pointer-events: none;
      animation: breathe 7s ease-in-out infinite;
    }
    @keyframes breathe { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

    /* ── Centre stage ───────────────────────────────────────────────────── */
    .stage {
      position: fixed; inset: 0; z-index: 3;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    .wordmark {
      font-weight: 700;
      font-size: clamp(2.1rem, 5.4vw, 4.6rem);
      letter-spacing: 0.17em;
      line-height: 1;
      white-space: nowrap;
      color: #f6f9fe;
      text-shadow: 0 0 26px rgba(176, 204, 255, 0.18);
    }

    .subtitle {
      margin-top: 20px;
      font-size: 0.72rem; font-weight: 400;
      letter-spacing: 0.46em; text-transform: uppercase;
      color: rgba(206, 220, 244, 0.32);
      white-space: nowrap;
    }

    /* ── Loader — thin, small, clean, indeterminate scan ────────────────── */
    .loader {
      position: relative; margin-top: 46px;
      width: 220px; height: 1px;
      background: rgba(214, 226, 250, 0.08);
      overflow: hidden;
    }
    .loader::after {
      content: ''; position: absolute; top: 0; left: -42%;
      width: 42%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(206, 224, 255, 0.85), transparent);
      animation: scan 1.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes scan { 0% { left: -42%; } 100% { left: 100%; } }

    @media (prefers-reduced-motion: reduce) {
      .glow, .loader::after { animation: none; }
      .glow { opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="stage">
    <h1 class="wordmark">FORGEMAPTOOLKIT</h1>
    <div class="subtitle">Forged Alliance Forever</div>
    <div class="loader"></div>
  </div>
</body>
</html>

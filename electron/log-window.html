<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Application Log</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:         #0a0a0a;
      --bg-toolbar: #0e0e0e;
      --border:     rgba(255,255,255,0.06);
      --border-mid: rgba(255,255,255,0.1);
      --text:       #e8e8e8;
      --text-sec:   rgba(255,255,255,0.45);
      --text-muted: rgba(255,255,255,0.2);
      --accent:     #ff8c00;
      --accent-glow:rgba(255,140,0,0.3);
      --c-debug: rgba(255,255,255,0.2);
      --c-info:  #e8e8e8;
      --c-warn:  #ffb300;
      --c-error: #ff4d4d;
      --c-info-a: rgba(255,140,0,0.7);
    }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 12.5px/1.55 'Cascadia Code', 'Consolas', monospace;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #header {
      position: relative;
      padding: 18px 24px 14px;
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.2) 100%);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .hline { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%); box-shadow: 0 0 20px var(--accent-glow); }
    .hrow  { display: flex; align-items: center; gap: 12px; }
    .hicon { font-size: 1rem; color: var(--accent); }
    .htitle { font-size: 0.92rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; }
    .hunder { margin-top: 10px; height: 1px; background: linear-gradient(90deg, var(--accent) 0%, transparent 60%); opacity: 0.3; }
    #toolbar {
      display: flex; gap: 8px; align-items: center;
      padding: 10px 24px;
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; flex-wrap: wrap;
    }
    .tb-select {
      appearance: none; -webkit-appearance: none;
      background: rgba(255,255,255,0.04);
      color: var(--text); border: 1px solid var(--border-mid);
      padding: 5px 12px; font-size: 0.82rem; font-family: inherit;
      outline: none; cursor: pointer;
    }
    .tb-select:focus, .tb-select:hover { border-color: rgba(255,140,0,0.5); }
    #toolbar input[type=text] {
      background: rgba(255,255,255,0.04); color: var(--text);
      border: 1px solid var(--border-mid); padding: 5px 12px;
      font-size: 0.82rem; font-family: inherit; outline: none; width: 200px;
    }
    #toolbar input[type=text]:focus { border-color: rgba(255,140,0,0.5); }
    #toolbar input[type=text]::placeholder { color: var(--text-muted); }
    .sep { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }
    #toolbar button {
      background: rgba(255,255,255,0.04); color: var(--text-sec);
      border: 1px solid var(--border-mid); padding: 5px 14px;
      font-size: 0.82rem; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; font-family: inherit; cursor: pointer;
    }
    #toolbar button:hover { border-color: rgba(255,140,0,0.5); color: var(--accent); background: rgba(255,140,0,0.06); }
    #toolbar button.active { border-color: var(--accent); color: var(--accent); }
    #stats { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }
    #log {
      flex: 1; overflow-y: auto; padding: 4px 0;
      scrollbar-width: thin; scrollbar-color: rgba(255,140,0,0.3) transparent;
    }
    #log::-webkit-scrollbar { width: 4px; }
    #log::-webkit-scrollbar-thumb { background: rgba(255,140,0,0.25); }
    .line { padding: 2px 24px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; border-left: 2px solid transparent; }
    .line:hover { background: rgba(255,255,255,0.03); }
    .line.debug { color: var(--c-debug); border-left-color: rgba(255,255,255,0.08); }
    .line.info  { color: var(--c-info);  border-left-color: var(--c-info-a); }
    .line.warn  { color: var(--c-warn);  border-left-color: var(--c-warn); background: rgba(255,179,0,0.04); }
    .line.error { color: var(--c-error); border-left-color: var(--c-error); background: rgba(255,77,77,0.06); }
    .time { color: rgba(255,255,255,0.15); margin-right: 8px; user-select: none; }
    .lvl  { display: inline-block; width: 44px; font-weight: 700; margin-right: 4px; }
    .lvl.debug { color: rgba(255,255,255,0.25); }
    .lvl.info  { color: var(--c-info-a); }
    .lvl.warn  { color: var(--c-warn); }
    .lvl.error { color: var(--c-error); }
    #statusbar {
      display: flex; gap: 12px; align-items: center;
      padding: 6px 24px; background: var(--bg-toolbar);
      border-top: 1px solid var(--border); font-size: 11px;
      color: var(--text-muted); flex-shrink: 0;
    }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
    .dot.live   { background: #34d399; box-shadow: 0 0 6px rgba(52,211,153,0.6); }
    .dot.paused { background: var(--c-warn); }
  </style>
</head>
<body>
  <div id="header">
    <div class="hline"></div>
    <div class="hrow"><span class="hicon">&#x2630;</span><span class="htitle">Application Log</span></div>
    <div class="hunder"></div>
  </div>
  <div id="toolbar">
    <label>Level:</label>
    <select id="filterLevel" class="tb-select">
      <option value="0">All</option>
      <option value="1">Debug+</option>
      <option value="2">Info+</option>
      <option value="3">Warn+</option>
      <option value="4">Errors only</option>
    </select>
    <div class="sep"></div>
    <label>Search:</label>
    <input id="search" type="text" placeholder="Filter by text…"/>
    <div class="sep"></div>
    <button id="pauseBtn">⏸ Pause</button>
    <button id="clearBtn">Clear</button>
    <button id="exportBtn">Export</button>
    <button id="scrollBtn">Bottom</button>
    <span id="stats">0 lines</span>
  </div>
  <div id="log"></div>
  <div id="statusbar">
    <span><span class="dot live" id="liveDot"></span><span id="liveLabel">Live</span></span>
    <span id="errorCount" style="color:#ff7b72">0 errors</span>
    <span id="warnCount"  style="color:#d29922">0 warnings</span>
    <span id="logFile" style="margin-left:auto"></span>
  </div>
  <script>
    const logEl        = document.getElementById('log');
    const filterLevel  = document.getElementById('filterLevel');
    const searchEl     = document.getElementById('search');
    const statsEl      = document.getElementById('stats');
    const errorCountEl = document.getElementById('errorCount');
    const warnCountEl  = document.getElementById('warnCount');
    const liveDot      = document.getElementById('liveDot');
    const liveLabel    = document.getElementById('liveLabel');

    const LEVELS = { all: 0, debug: 1, info: 2, warn: 3, error: 4 };
    let lines = [], autoScroll = true, paused = false, errorCount = 0, warnCount = 0;

    function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function levelNum(l) { return LEVELS[l] ?? 0; }

    function renderLine(l) {
      const minLevel = parseInt(filterLevel.value, 10);
      if (levelNum(l.level) < minLevel) return null;
      const q = searchEl.value.toLowerCase();
      if (q && !l.msg.toLowerCase().includes(q) && !l.level.includes(q) && !l.time.includes(q)) return null;
      const el = document.createElement('div');
      el.className = 'line ' + l.level;
      const ts = l.time.replace('T',' ').replace('Z','');
      el.innerHTML = '<span class="time">' + ts + '</span><span class="lvl ' + l.level + '">[' + l.level.toUpperCase() + ']</span>' + escHtml(l.msg);
      return el;
    }

    function redraw() {
      logEl.innerHTML = '';
      const frag = document.createDocumentFragment();
      lines.forEach(l => { const el = renderLine(l); if (el) frag.appendChild(el); });
      logEl.appendChild(frag);
      updateStats();
      if (autoScroll) logEl.scrollTop = logEl.scrollHeight;
    }

    function updateStats() {
      errorCount = lines.filter(l => l.level === 'error').length;
      warnCount  = lines.filter(l => l.level === 'warn').length;
      statsEl.textContent      = lines.length + ' total lines';
      errorCountEl.textContent = errorCount + ' errors';
      warnCountEl.textContent  = warnCount  + ' warnings';
    }

    function appendLine(l) {
      lines.push(l);
      if (lines.length > 5000) lines.shift();
      if (l.level === 'error') errorCount++;
      if (l.level === 'warn')  warnCount++;
      errorCountEl.textContent = errorCount + ' errors';
      warnCountEl.textContent  = warnCount  + ' warnings';
      statsEl.textContent = lines.length + ' total lines';
      const el = renderLine(l);
      if (el) { logEl.appendChild(el); if (autoScroll) logEl.scrollTop = logEl.scrollHeight; }
    }

    window.logBridge.onHistory((history) => {
      lines = []; errorCount = 0; warnCount = 0;
      history.forEach(l => lines.push(l));
      redraw();
    });

    window.logBridge.onLine((l) => { if (!paused) appendLine(l); });

    filterLevel.addEventListener('change', redraw);
    searchEl.addEventListener('input', redraw);

    document.getElementById('pauseBtn').addEventListener('click', function() {
      paused = !paused;
      this.textContent = paused ? '▶ Resume' : '⏸ Pause';
      this.classList.toggle('active', paused);
      liveDot.className = 'dot ' + (paused ? 'paused' : 'live');
      liveLabel.textContent = paused ? 'Paused' : 'Live';
    });
    document.getElementById('clearBtn').addEventListener('click', () => { lines = []; errorCount = 0; warnCount = 0; redraw(); });
    document.getElementById('scrollBtn').addEventListener('click', () => { logEl.scrollTop = logEl.scrollHeight; autoScroll = true; });
    document.getElementById('exportBtn').addEventListener('click', () => {
      const text = lines.map(l => '[' + l.time + '] [' + l.level.toUpperCase().padEnd(5) + '] ' + l.msg).join('\n');
      const blob = new Blob([text], { type: 'text/plain' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'app-log-' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.txt'; a.click();
    });
    logEl.addEventListener('scroll', () => {
      autoScroll = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 60;
    });

    // Sanity check — if logBridge is not exposed the preload didn't load.
    if (!window.logBridge) {
      document.getElementById('log').innerHTML =
        '<div style="color:#ff4d4d;padding:24px;font-size:13px">' +
        '⚠ logBridge not available — preload script failed to load.<br>' +
        'Check that log-preload.js exists next to main.js and that contextIsolation is enabled.' +
        '</div>';
    } else {
      window.logBridge.getLogFilePath()
        .then(p => { document.getElementById('logFile').textContent = p || ''; })
        .catch(() => {});
      // Request history — listeners are already registered above, so this is safe.
      window.logBridge.requestHistory();
    }
  </script>
</body>
</html>

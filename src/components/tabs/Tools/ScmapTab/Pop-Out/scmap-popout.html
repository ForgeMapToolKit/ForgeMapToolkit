<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="../../../../../public/assets/icons/App/icon.ico" type="image/x-icon"/>
  <title>ForgeMapToolkit — SCMAP Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow:        #FFFA00;
      --yellow-glow:   rgba(255, 250, 0, 0.35);
      --yellow-strong: rgba(255, 250, 0, 0.6);
      --bg:            #0a0a0a;
      --bg-card:       #111111;
      --border:        rgba(255, 255, 255, 0.08);
      --text:          #ffffff;
      --text-sec:      rgba(255, 255, 255, 0.45);
      --text-muted:    rgba(255, 255, 255, 0.2);
      --ok:            rgba(180, 255, 180, 0.85);
      --err:           rgba(255, 100, 100, 0.9);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      overflow: hidden;
    }

    .root {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 16px;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      font-size: 1.1rem;
      color: var(--yellow);
      filter: drop-shadow(0 0 8px var(--yellow-glow));
    }
    .header-title {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .header-sub {
      margin-left: auto;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* ── Mode hint pills ────────────────────────────────────── */
    .mode-hints {
      display: flex;
      gap: 8px;
    }
    .mode-pill {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      border-radius: 2px;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      transition: all 0.2s ease;
    }
    .mode-pill.active-unpack {
      border-color: rgba(255,250,0,0.5);
      background: rgba(255,250,0,0.06);
      color: var(--yellow);
    }
    .mode-pill.active-pack {
      border-color: rgba(100,200,255,0.5);
      background: rgba(100,200,255,0.06);
      color: rgba(100,200,255,0.9);
    }

    /* ── Drop zone ──────────────────────────────────────────── */
    .drop-zone {
      flex: 1;
      border: 2px dashed rgba(255, 250, 0, 0.2);
      background: rgba(255, 250, 0, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      overflow: hidden;
    }
    .drop-zone:hover {
      border-color: rgba(255, 250, 0, 0.4);
      background: rgba(255, 250, 0, 0.04);
    }
    .drop-zone.dragging {
      border-color: var(--yellow);
      background: rgba(255, 250, 0, 0.07);
      box-shadow: 0 0 40px var(--yellow-glow), inset 0 0 40px rgba(255,250,0,0.04);
    }
    .drop-zone.has-file  { border-color: rgba(255,250,0,0.35);   border-style: solid; }
    .drop-zone.has-folder{ border-color: rgba(100,200,255,0.35); border-style: solid; }
    .drop-zone.running   { cursor: default; pointer-events: none; }

    .drop-icon {
      font-size: 2.8rem;
      color: rgba(255,255,255,0.15);
      transition: all 0.3s ease;
      line-height: 1;
    }
    .drop-zone:hover .drop-icon,
    .drop-zone.dragging .drop-icon { color: var(--yellow); filter: drop-shadow(0 0 16px var(--yellow-strong)); }
    .drop-zone.has-file .drop-icon  { color: var(--yellow);             filter: drop-shadow(0 0 12px var(--yellow-glow)); }
    .drop-zone.has-folder .drop-icon{ color: rgba(100,200,255,0.9);     filter: drop-shadow(0 0 12px rgba(100,200,255,0.4)); }

    .drop-label {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color 0.25s;
    }
    .drop-zone:hover .drop-label,
    .drop-zone.dragging .drop-label { color: var(--yellow); }
    .drop-zone.has-file .drop-label,
    .drop-zone.has-folder .drop-label { color: var(--text-sec); font-weight: 400; font-size: 0.72rem; }

    .drop-filename {
      font-size: 0.85rem;
      font-family: 'Courier New', monospace;
      color: var(--yellow);
      max-width: 80%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }
    .drop-zone.has-folder .drop-filename { color: rgba(100,200,255,0.9); }

    .drop-hint {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    /* ── Progress bar strip ─────────────────────────────────── */
    .progress-strip {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: rgba(255,255,255,0.04);
      overflow: hidden;
    }
    .progress-strip-inner {
      height: 100%;
      background: var(--yellow);
      box-shadow: 0 0 10px var(--yellow-glow);
      animation: progressScan 1.2s ease-in-out infinite;
      transform-origin: left;
    }
    @keyframes progressScan {
      0%   { transform: translateX(-100%) scaleX(0.4); }
      50%  { transform: translateX(60%)   scaleX(0.6); }
      100% { transform: translateX(200%)  scaleX(0.3); }
    }

    /* ── Action button ──────────────────────────────────────── */
    .action-btn {
      width: 100%;
      padding: 13px;
      background: var(--yellow);
      color: var(--bg);
      border: none;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .action-btn.pack-mode {
      background: rgba(100,200,255,0.9);
    }
    .action-btn:hover:not(:disabled) {
      box-shadow: 0 0 28px var(--yellow-strong), 0 6px 20px rgba(0,0,0,0.5);
      transform: translateY(-1px);
    }
    .action-btn.pack-mode:hover:not(:disabled) {
      box-shadow: 0 0 28px rgba(100,200,255,0.5), 0 6px 20px rgba(0,0,0,0.5);
    }
    .action-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .spin { display: inline-block; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Log ────────────────────────────────────────────────── */
    .log {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 10px 12px;
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      line-height: 1.65;
      max-height: 100px;
      overflow-y: auto;
      color: var(--text-sec);
    }
    .log::-webkit-scrollbar { width: 3px; }
    .log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
    .log-ok   { color: var(--ok); }
    .log-err  { color: var(--err); }
    .log-info { color: rgba(255,250,0,0.6); }

    /* ── Open folder button ─────────────────────────────────── */
    .open-btn {
      width: 100%;
      padding: 10px;
      background: rgba(255,255,255,0.04);
      color: var(--text-sec);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      display: none;
    }
    .open-btn.visible { display: block; }
    .open-btn:hover { border-color: var(--yellow); color: var(--yellow); background: rgba(255,250,0,0.05); }

    /* ── Global drag highlight ──────────────────────────────── */
    body.global-drag .drop-zone {
      border-color: var(--yellow);
      background: rgba(255,250,0,0.06);
      box-shadow: 0 0 50px var(--yellow-glow);
    }
  </style>
</head>
<body>

<div class="root">

  <div class="header">
    <span class="header-icon">&#x2B21;</span>
    <span class="header-title">SCMAP Tool</span>
    <span class="header-sub">Drop file or folder</span>
  </div>

  <div class="mode-hints">
    <div class="mode-pill" id="pillUnpack">⬇ .scmap → unpack</div>
    <div class="mode-pill" id="pillPack">⬆ folder → pack</div>
  </div>

  <div class="drop-zone" id="dropZone">
    <div class="drop-icon" id="dropIcon">&#x2B07;</div>
    <div class="drop-label" id="dropLabel">Drop .scmap or folder here</div>
    <div class="drop-filename" id="dropFilename" style="display:none"></div>
    <div class="drop-hint" id="dropHint">or click to browse</div>
    <div class="progress-strip" id="progressStrip" style="display:none">
      <div class="progress-strip-inner"></div>
    </div>
  </div>

  <button class="open-btn" id="openBtn">📂 Open Output Folder</button>

  <div class="log" id="log" style="display:none"></div>

</div>

<script>
  const ipc = window.electronAPI;

  // ── State ──────────────────────────────────────────────────
  let selectedPath  = null;
  let selectedMode  = null; // 'unpack' | 'pack'
  let outputFolder  = null;
  let running       = false;
  let dragCounter   = 0;
  let appSettings   = {};

  ipc.invoke('settings-load').then(s => { appSettings = s || {}; }).catch(() => {});
  ipc.on('settings-updated', (_, s) => { if (s) appSettings = s; });

  // ── Elements ───────────────────────────────────────────────
  const dropZone      = document.getElementById('dropZone');
  const dropIcon      = document.getElementById('dropIcon');
  const dropLabel     = document.getElementById('dropLabel');
  const dropFilename  = document.getElementById('dropFilename');
  const dropHint      = document.getElementById('dropHint');
  const progressStrip = document.getElementById('progressStrip');
  const openBtn       = document.getElementById('openBtn');
  const logEl         = document.getElementById('log');
  const pillUnpack    = document.getElementById('pillUnpack');
  const pillPack      = document.getElementById('pillPack');

  function getFilePath(file) {
    try { if (ipc?.getPathForFile) return ipc.getPathForFile(file); } catch(_) {}
    return file.path ?? null;
  }

  // ── Set selection ──────────────────────────────────────────
  function setSelection(fp, name, mode, autoRun = false) {
    selectedPath = fp;
    selectedMode = mode;
    outputFolder = null;
    openBtn.classList.remove('visible');
    clearLog();

    dropZone.classList.remove('has-file', 'has-folder');
    dropZone.classList.add(mode === 'unpack' ? 'has-file' : 'has-folder');

    dropIcon.textContent     = mode === 'unpack' ? '📄' : '📁';
    dropLabel.textContent    = mode === 'unpack' ? 'Click to change file' : 'Click to change folder';
    dropFilename.textContent = name;
    dropFilename.style.display = 'block';
    dropHint.textContent     = mode === 'unpack' ? 'or drop another .scmap / folder' : 'or drop another folder / .scmap';

    pillUnpack.className = mode === 'unpack' ? 'mode-pill active-unpack' : 'mode-pill';
    pillPack.className   = mode === 'pack'   ? 'mode-pill active-pack'   : 'mode-pill';

    if (autoRun) doAction();
  }

  function resetSelection() {
    selectedPath = null;
    selectedMode = null;
    outputFolder = null;
    dropZone.classList.remove('has-file', 'has-folder');
    dropIcon.textContent       = '⬇';
    dropLabel.textContent      = 'Drop .scmap or folder here';
    dropFilename.style.display = 'none';
    dropHint.textContent       = 'or click to browse';
    pillUnpack.className       = 'mode-pill';
    pillPack.className         = 'mode-pill';
    openBtn.classList.remove('visible');
  }

  // ── Detect what was dropped ────────────────────────────────
  function handleDropItems(e) {
    // Try to detect folder via items API first
    const items = [...(e.dataTransfer.items || [])];
    for (const item of items) {
      if (item.kind === 'file') {
        const entry = item.webkitGetAsEntry?.();
        if (entry?.isDirectory) {
          const file = item.getAsFile();
          const fp = getFilePath(file);
          if (fp) { setSelection(fp, entry.name, 'pack', true); return; }
        }
      }
    }
    // Fallback: check files
    const file = e.dataTransfer.files?.[0];
    if (!file) return;
    const fp = getFilePath(file);
    if (!fp) return;
    if (file.name.toLowerCase().endsWith('.scmap')) {
      setSelection(fp, file.name, 'unpack', true);
    } else {
      // Might be a folder dropped as file on some systems
      setSelection(fp, file.name, 'pack', true);
    }
  }

  // ── Drop zone click → browse ───────────────────────────────
  dropZone.addEventListener('click', async () => {
    if (running) return;
    // If already in pack mode, open folder picker; otherwise ask for file
    // If nothing selected yet, show both options via file picker (user can also browse folder)
    if (selectedMode === 'pack') {
      const res = await ipc.invoke('scmap-select-folder');
      if (!res.canceled) setSelection(res.path, res.path.split(/[\\/]/).pop(), 'pack', true);
    } else {
      // Default: file picker, but also allow folder selection via shift-click hint
      const res = await ipc.invoke('scmap-select-file');
      if (!res.canceled) setSelection(res.path, res.path.split(/[\\/]/).pop(), 'unpack', true);
    }
  });

  // Right-click or shift-click → folder browse
  dropZone.addEventListener('contextmenu', async e => {
    e.preventDefault();
    if (running) return;
    const res = await ipc.invoke('scmap-select-folder');
    if (!res.canceled) setSelection(res.path, res.path.split(/[\\/]/).pop(), 'pack', true);
  });

  // ── Drag & Drop ────────────────────────────────────────────
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragging'); });
  dropZone.addEventListener('dragleave', e => { dropZone.classList.remove('dragging'); });
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragging');
    document.body.classList.remove('global-drag');
    dragCounter = 0;
    handleDropItems(e);
  });

  document.addEventListener('dragenter', e => {
    e.preventDefault();
    dragCounter++;
    if ([...(e.dataTransfer?.items||[])].some(i => i.kind === 'file')) document.body.classList.add('global-drag');
  });
  document.addEventListener('dragleave', e => {
    e.preventDefault();
    if (--dragCounter <= 0) { dragCounter = 0; document.body.classList.remove('global-drag'); }
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    dragCounter = 0;
    document.body.classList.remove('global-drag');
    handleDropItems(e);
  });

  // ── Progress listener ──────────────────────────────────────
  ipc.on('scmap-progress', (_, payload) => {
    appendLog(typeof payload === 'string' ? payload : (payload?.msg ?? JSON.stringify(payload)), 'info');
  });

  // ── Main action ────────────────────────────────────────────
  async function doAction() {
    if (!selectedPath || !selectedMode || running) return;
    running = true;
    dropZone.classList.add('running');
    progressStrip.style.display = 'block';
    openBtn.classList.remove('visible');
    clearLog();

    if (selectedMode === 'unpack') {
      dropLabel.textContent = 'Unpacking…';
      appendLog(`Unpacking: ${selectedPath}`, 'info');
      const res = await ipc.invoke('scmap-unpack', { scmapPath: selectedPath });
      progressStrip.style.display = 'none';
      running = false;
      dropZone.classList.remove('running');
      if (res.success) {
        outputFolder = res.outputFolder;
        appendLog(`✓ Done → ${res.outputFolder}`, 'ok');
        dropLabel.textContent = '✓ Done — drop another to unpack';
        openBtn.classList.add('visible');
        if (appSettings.autoOpenExportFolder) {
          await ipc.invoke('open-folder', { folderPath: res.outputFolder });
        }
      } else {
        appendLog(`✗ ${res.error}`, 'err');
        dropLabel.textContent = '✗ Failed — drop another to retry';
      }

    } else {
      dropLabel.textContent = 'Packing…';
      appendLog(`Packing: ${selectedPath}`, 'info');
      const res = await ipc.invoke('scmap-pack-folder', { folderPath: selectedPath });
      progressStrip.style.display = 'none';
      running = false;
      dropZone.classList.remove('running');
      if (res.success) {
        outputFolder = res.outputPath.replace(/[\\\/][^\\\/]+$/, '');
        appendLog(`✓ Written: ${res.outputPath} (${(res.bytes/1024).toFixed(1)} KB)`, 'ok');
        dropLabel.textContent = '✓ Done — drop another to pack';
        openBtn.classList.add('visible');
        if (appSettings.autoOpenExportFolder) {
          await ipc.invoke('open-folder', { folderPath: outputFolder });
        }
      } else {
        appendLog(`✗ ${res.error}`, 'err');
        dropLabel.textContent = '✗ Failed — drop another to retry';
      }
    }
  }

  openBtn.addEventListener('click', async () => {
    if (outputFolder) await ipc.invoke('open-folder', { folderPath: outputFolder });
  });

  // ── Log helpers ────────────────────────────────────────────
  function clearLog() { logEl.innerHTML = ''; logEl.style.display = 'none'; }
  function appendLog(text, type) {
    logEl.style.display = 'block';
    const line = document.createElement('div');
    line.className = `log-${type}`;
    line.textContent = text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
</script>
</body>
</html>

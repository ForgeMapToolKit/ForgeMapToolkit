<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="../../../../../public/assets/icons/App/icon.ico" type="image/x-icon"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <title>ForgeMapToolkit — SCMAP Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c:   #FFFA00;
      --g:   rgba(255, 250, 0, 0.35);
      --gs:  rgba(255, 250, 0, 0.60);
      --disp: 'Space Grotesk', system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'Cascadia Code', 'Courier New', monospace;
      --ok:  rgba(0, 200, 100, 0.7);
      --err: rgba(255, 80, 80, 0.85);
    }

    html, body {
      width: 100%; height: 100%;
      background: #070708;
      background-image: radial-gradient(circle, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 28px 28px;
      color: rgba(255,255,255,0.93);
      font-family: var(--disp);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overflow: hidden;
    }
    /* ambient hue bleed + vignette — the workspace wash */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(60% 50% at 10% -8%, color-mix(in srgb, var(--c) 7%, transparent), transparent 66%),
        radial-gradient(130% 120% at 50% 40%, transparent 56%, rgba(0,0,0,0.5) 100%);
    }

    .root {
      position: relative;
      z-index: 1;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      padding: 22px 24px 20px;
      gap: 16px;
    }

    /* ── Header — printed register ───────────────────────────── */
    .eyebrow {
      font-size: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.16);
    }
    .titlebar { display: flex; align-items: baseline; justify-content: space-between; margin-top: 9px; gap: 12px; }
    .title {
      font-family: var(--disp);
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 0.9;
      text-transform: uppercase;
      color: rgba(255,255,255,0.93);
    }
    .sub {
      font-size: 0.54rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      white-space: nowrap;
    }
    .trace { position: relative; height: 1px; width: 100%; margin: 13px 0 2px; }
    .trace i { position: absolute; left: 0; top: 0; height: 1px; }
    .trace .ln { width: 120px; background: var(--c); box-shadow: 0 0 6px var(--g); }
    .trace .ht { width: 40px; background: rgba(255,255,255,0.85); opacity: 0.5; }

    /* ── Mode hints — boxless, phosphor tick lights the active one ── */
    .modes { display: flex; gap: 26px; }
    .mode-pill { display: flex; align-items: center; gap: 9px; }
    .mp-tick {
      width: 2px; height: 12px;
      background: rgba(255,255,255,0.16);
      transform: scaleY(0.4);
      transform-origin: center;
      transition: background 0.6s cubic-bezier(0.2,0.55,0.35,1), box-shadow 0.6s, transform 0.6s;
    }
    .mp-text {
      font-family: var(--disp);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      transition: color 0.3s linear;
    }
    .mode-pill.active-unpack .mp-tick,
    .mode-pill.active-pack   .mp-tick {
      background: var(--c);
      box-shadow: 0 0 10px var(--gs), 0 0 3px var(--c);
      transform: scaleY(1);
      transition-duration: 0.06s;
    }
    .mode-pill.active-unpack .mp-text,
    .mode-pill.active-pack   .mp-text { color: rgba(255,255,255,0.9); }

    /* ── Drop well — recessed instrument stage ───────────────── */
    .drop-zone {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      overflow: hidden;
      background: radial-gradient(125% 125% at 50% 0%, #0c0c0f 0%, #050506 70%);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow:
        inset 0 0 64px rgba(0,0,0,0.72),
        inset 0 1px 0 rgba(255,255,255,0.03),
        0 24px 52px -32px rgba(0,0,0,0.95);
      transition: border-color 0.25s cubic-bezier(0.2,0.55,0.35,1), box-shadow 0.25s cubic-bezier(0.2,0.55,0.35,1);
    }
    .drop-zone::before,
    .drop-zone::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      z-index: 2;
      pointer-events: none;
      transition: border-color 0.45s cubic-bezier(0.2,0.55,0.35,1);
    }
    .drop-zone::before { top: 10px; left: 10px; border-top: 1px solid rgba(255,255,255,0.22); border-left: 1px solid rgba(255,255,255,0.22); }
    .drop-zone::after  { bottom: 10px; right: 10px; border-bottom: 1px solid rgba(255,255,255,0.22); border-right: 1px solid rgba(255,255,255,0.22); }
    .drop-zone:hover {
      border-color: color-mix(in srgb, var(--c) 30%, rgba(255,255,255,0.14));
      box-shadow:
        inset 0 0 64px rgba(0,0,0,0.72),
        inset 0 1px 0 rgba(255,255,255,0.03),
        0 24px 52px -32px rgba(0,0,0,0.95),
        0 0 26px -10px var(--g);
    }
    .drop-zone:hover::before,
    .drop-zone:hover::after,
    .drop-zone.dragging::before,
    .drop-zone.dragging::after { border-color: color-mix(in srgb, var(--c) 60%, rgba(255,255,255,0.2)); transition-duration: 0.08s; }
    .drop-zone.dragging,
    body.global-drag .drop-zone {
      border-color: var(--c);
      box-shadow:
        inset 0 0 60px rgba(0,0,0,0.6),
        0 0 50px -12px var(--g),
        inset 0 0 40px -16px var(--g);
    }
    .drop-zone.has-file,
    .drop-zone.has-folder { border-color: color-mix(in srgb, var(--c) 38%, rgba(255,255,255,0.14)); }
    .drop-zone.running { cursor: default; pointer-events: none; }

    .drop-label {
      position: relative;
      z-index: 1;
      font-family: var(--disp);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      text-align: center;
      padding: 0 24px;
      transition: color 0.25s linear;
    }
    .drop-zone:hover .drop-label { color: rgba(255,255,255,0.72); }
    .drop-zone.has-file .drop-label,
    .drop-zone.has-folder .drop-label,
    .drop-zone.running .drop-label {
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      color: rgba(255,255,255,0.42);
    }
    .drop-filename {
      position: relative;
      z-index: 1;
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: color-mix(in srgb, var(--c) 85%, #fff);
      max-width: 84%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }
    .drop-hint {
      position: relative;
      z-index: 1;
      font-family: var(--disp);
      font-size: 0.66rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.28);
    }
    /* breathing filament under the idle prompt — the stage is armed */
    .drop-fil {
      position: relative;
      z-index: 1;
      width: 40px; height: 1px;
      background: var(--c);
      box-shadow: 0 0 8px var(--g);
      opacity: 0.4;
      animation: scmap-breathe 2.6s cubic-bezier(0.2,0.55,0.35,1) infinite;
    }
    .drop-zone.has-file .drop-fil,
    .drop-zone.has-folder .drop-fil,
    .drop-zone.running .drop-fil { display: none; }
    @keyframes scmap-breathe {
      0%, 100% { opacity: 0.25; transform: scaleX(0.7); }
      50%      { opacity: 0.7;  transform: scaleX(1); }
    }

    /* calibration scanline while running */
    .progress-strip {
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 1px;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(90deg, transparent 4%, var(--c) 50%, transparent 96%);
      box-shadow: 0 0 14px var(--gs);
      animation: scmap-scan 1.1s cubic-bezier(0.55,0,0.15,1) infinite;
    }
    .progress-strip-inner { display: none; }
    @keyframes scmap-scan {
      0%   { top: 0;    opacity: 0; }
      12%  { opacity: 0.7; }
      85%  { opacity: 0.35; }
      100% { top: 100%; opacity: 0; }
    }

    /* ── Open-folder — boxless filament-stub action ──────────── */
    .open-btn {
      position: relative;
      display: none;
      align-self: flex-start;
      padding: 9px 2px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--disp);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      transition: color 0.25s linear, letter-spacing 0.26s cubic-bezier(0.16,1,0.3,1);
    }
    .open-btn.visible { display: inline-flex; }
    .open-btn::after {
      content: '';
      position: absolute;
      left: 0; bottom: 2px;
      height: 1px; width: 16px;
      background: var(--c);
      opacity: 0.45;
      box-shadow: 0 0 6px var(--g);
      transition: width 0.45s cubic-bezier(0.16,1,0.3,1), opacity 0.25s linear;
    }
    .open-btn:hover { color: rgba(255,255,255,0.93); letter-spacing: 0.19em; }
    .open-btn:hover::after { width: 100%; opacity: 1; }

    /* ── Console log ─────────────────────────────────────────── */
    .log {
      display: none;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 11px;
      font-family: var(--mono);
      font-size: 0.66rem;
      line-height: 1.75;
      max-height: 108px;
      overflow-y: auto;
      color: rgba(255,255,255,0.38);
      scrollbar-width: thin;
    }
    .log::-webkit-scrollbar { width: 3px; }
    .log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); }
    .log-ok   { color: var(--ok); }
    .log-err  { color: var(--err); }
    .log-info { color: color-mix(in srgb, var(--c) 75%, #fff); }

    @media (prefers-reduced-motion: reduce) {
      .drop-fil, .progress-strip { animation: none !important; }
    }
  </style>
</head>
<body>

<div class="root">

  <div class="head">
    <div class="eyebrow">SCMAP Register — Binary Console</div>
    <div class="titlebar">
      <h1 class="title">SCMAP</h1>
      <span class="sub">Drop file or folder</span>
    </div>
    <div class="trace"><i class="ln"></i><i class="ht"></i></div>
  </div>

  <div class="modes">
    <div class="mode-pill" id="pillUnpack"><span class="mp-tick"></span><span class="mp-text">.scmap → unpack</span></div>
    <div class="mode-pill" id="pillPack"><span class="mp-tick"></span><span class="mp-text">folder → pack</span></div>
  </div>

  <div class="drop-zone" id="dropZone">
    <div class="drop-label" id="dropLabel">Drop .scmap or folder here</div>
    <div class="drop-filename" id="dropFilename" style="display:none"></div>
    <div class="drop-hint" id="dropHint">or click to browse</div>
    <span class="drop-fil" id="dropFil" aria-hidden="true"></span>
    <div class="progress-strip" id="progressStrip" style="display:none">
      <div class="progress-strip-inner"></div>
    </div>
  </div>

  <button class="open-btn" id="openBtn">Open Output Folder</button>

  <div class="log" id="log" style="display:none"></div>

</div>

<script>
  const ipc = window.electronAPI;

  // ── State ──────────────────────────────────────────────────
  let selectedPath  = null;
  let selectedMode  = null; // 'unpack' | 'pack'
  let outputFolder  = null;
  let running       = false;
  let dragCounter   = 0;
  let appSettings   = {};

  ipc.invoke('settings-load').then(s => { appSettings = s || {}; }).catch(() => {});
  ipc.on('settings-updated', (_, s) => { if (s) appSettings = s; });

  // ── Elements ───────────────────────────────────────────────
  const dropZone      = document.getElementById('dropZone');
  const dropLabel     = document.getElementById('dropLabel');
  const dropFilename  = document.getElementById('dropFilename');
  const dropHint      = document.getElementById('dropHint');
  const progressStrip = document.getElementById('progressStrip');
  const openBtn       = document.getElementById('openBtn');
  const logEl         = document.getElementById('log');
  const pillUnpack    = document.getElementById('pillUnpack');
  const pillPack      = document.getElementById('pillPack');

  function getFilePath(file) {
    try { if (ipc?.getPathForFile) return ipc.getPathForFile(file); } catch(_) {}
    return file.path ?? null;
  }

  // ── Set selection ──────────────────────────────────────────
  function setSelection(fp, name, mode, autoRun = false) {
    selectedPath = fp;
    selectedMode = mode;
    outputFolder = null;
    openBtn.classList.remove('visible');
    clearLog();

    dropZone.classList.remove('has-file', 'has-folder');
    dropZone.classList.add(mode === 'unpack' ? 'has-file' : 'has-folder');

    dropLabel.textContent    = mode === 'unpack' ? 'Click to change file' : 'Click to change folder';
    dropFilename.textContent = name;
    dropFilename.style.display = 'block';
    dropHint.textContent     = mode === 'unpack' ? 'or drop another .scmap / folder' : 'or drop another folder / .scmap';

    pillUnpack.className = mode === 'unpack' ? 'mode-pill active-unpack' : 'mode-pill';
    pillPack.className   = mode === 'pack'   ? 'mode-pill active-pack'   : 'mode-pill';

    if (autoRun) doAction();
  }

  function resetSelection() {
    selectedPath = null;
    selectedMode = null;
    outputFolder = null;
    dropZone.classList.remove('has-file', 'has-folder');
    dropLabel.textContent      = 'Drop .scmap or folder here';
    dropFilename.style.display = 'none';
    dropHint.textContent       = 'or click to browse';
    pillUnpack.className        = 'mode-pill';
    pillPack.className          = 'mode-pill';
    openBtn.classList.remove('visible');
  }

  // ── Detect what was dropped ────────────────────────────────
  function handleDropItems(e) {
    // Try to detect folder via items API first
    const items = [...(e.dataTransfer.items || [])];
    for (const item of items) {
      if (item.kind === 'file') {
        const entry = item.webkitGetAsEntry?.();
        if (entry?.isDirectory) {
          const file = item.getAsFile();
          const fp = getFilePath(file);
          if (fp) { setSelection(fp, entry.name, 'pack', true); return; }
        }
      }
    }
    // Fallback: check files
    const file = e.dataTransfer.files?.[0];
    if (!file) return;
    const fp = getFilePath(file);
    if (!fp) return;
    if (file.name.toLowerCase().endsWith('.scmap')) {
      setSelection(fp, file.name, 'unpack', true);
    } else {
      // Might be a folder dropped as file on some systems
      setSelection(fp, file.name, 'pack', true);
    }
  }

  // ── Drop zone click → browse ───────────────────────────────
  dropZone.addEventListener('click', async () => {
    if (running) return;
    // If already in pack mode, open folder picker; otherwise ask for file
    // If nothing selected yet, show both options via file picker (user can also browse folder)
    if (selectedMode === 'pack') {
      const res = await ipc.invoke('scmap-select-folder');
      if (!res.canceled) setSelection(res.path, res.path.split(/[\\/]/).pop(), 'pack', true);
    } else {
      // Default: file picker, but also allow folder selection via shift-click hint
      const res = await ipc.invoke('scmap-select-file');
      if (!res.canceled) setSelection(res.path, res.path.split(/[\\/]/).pop(), 'unpack', true);
    }
  });

  // Right-click or shift-click → folder browse
  dropZone.addEventListener('contextmenu', async e => {
    e.preventDefault();
    if (running) return;
    const res = await ipc.invoke('scmap-select-folder');
    if (!res.canceled) setSelection(res.path, res.path.split(/[\\/]/).pop(), 'pack', true);
  });

  // ── Drag & Drop ────────────────────────────────────────────
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragging'); });
  dropZone.addEventListener('dragleave', e => { dropZone.classList.remove('dragging'); });
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragging');
    document.body.classList.remove('global-drag');
    dragCounter = 0;
    handleDropItems(e);
  });

  document.addEventListener('dragenter', e => {
    e.preventDefault();
    dragCounter++;
    if ([...(e.dataTransfer?.items||[])].some(i => i.kind === 'file')) document.body.classList.add('global-drag');
  });
  document.addEventListener('dragleave', e => {
    e.preventDefault();
    if (--dragCounter <= 0) { dragCounter = 0; document.body.classList.remove('global-drag'); }
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    dragCounter = 0;
    document.body.classList.remove('global-drag');
    handleDropItems(e);
  });

  // ── Progress listener ──────────────────────────────────────
  ipc.on('scmap-progress', (_, payload) => {
    appendLog(typeof payload === 'string' ? payload : (payload?.msg ?? JSON.stringify(payload)), 'info');
  });

  // ── Main action ────────────────────────────────────────────
  async function doAction() {
    if (!selectedPath || !selectedMode || running) return;
    running = true;
    dropZone.classList.add('running');
    progressStrip.style.display = 'block';
    openBtn.classList.remove('visible');
    clearLog();

    if (selectedMode === 'unpack') {
      dropLabel.textContent = 'Extracting…';
      appendLog(`Unpacking: ${selectedPath}`, 'info');
      const res = await ipc.invoke('scmap-unpack', { scmapPath: selectedPath });
      progressStrip.style.display = 'none';
      running = false;
      dropZone.classList.remove('running');
      if (res.success) {
        outputFolder = res.outputFolder;
        appendLog(`✓ Done → ${res.outputFolder}`, 'ok');
        dropLabel.textContent = '✓ Done — drop another to unpack';
        openBtn.classList.add('visible');
        if (appSettings.autoOpenExportFolder) {
          await ipc.invoke('open-folder', { folderPath: res.outputFolder });
        }
      } else {
        appendLog(`✗ ${res.error}`, 'err');
        dropLabel.textContent = '✗ Failed — drop another to retry';
      }

    } else {
      dropLabel.textContent = 'Packing…';
      appendLog(`Packing: ${selectedPath}`, 'info');
      const res = await ipc.invoke('scmap-pack-folder', { folderPath: selectedPath });
      progressStrip.style.display = 'none';
      running = false;
      dropZone.classList.remove('running');
      if (res.success) {
        outputFolder = res.outputPath.replace(/[\\\/][^\\\/]+$/, '');
        appendLog(`✓ Written: ${res.outputPath} (${(res.bytes/1024).toFixed(1)} KB)`, 'ok');
        dropLabel.textContent = '✓ Done — drop another to pack';
        openBtn.classList.add('visible');
        if (appSettings.autoOpenExportFolder) {
          await ipc.invoke('open-folder', { folderPath: outputFolder });
        }
      } else {
        appendLog(`✗ ${res.error}`, 'err');
        dropLabel.textContent = '✗ Failed — drop another to retry';
      }
    }
  }

  openBtn.addEventListener('click', async () => {
    if (outputFolder) await ipc.invoke('open-folder', { folderPath: outputFolder });
  });

  // ── Log helpers ────────────────────────────────────────────
  function clearLog() { logEl.innerHTML = ''; logEl.style.display = 'none'; }
  function appendLog(text, type) {
    logEl.style.display = 'block';
    const line = document.createElement('div');
    line.className = `log-${type}`;
    line.textContent = text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
</script>
</body>
</html>
